version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - gosec
    - gocritic
    - revive
    - contextcheck
  settings:
    revive:
      rules:
        - name: deep-exit

formatters:
  enable:
    - gofmt
    - goimports
