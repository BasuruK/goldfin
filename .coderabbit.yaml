# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  pre_merge_checks:
    docstrings:
      mode: "off" # conflicts with the self-documenting-code policy
  path_instructions:
    - path: "tests/**"
      instructions: "Report correctness bugs only. Skip maintainability, style, and documentation findings on test code and test helpers."
